openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kuwait Training Needs Survey 2026/27 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: responses
    description: Public survey responses (draft, resume, complete)
  - name: admin
    description: Protected dashboard analytics (X-Admin-Key header)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /responses:
    post:
      operationId: createResponse
      tags: [responses]
      summary: Start a new draft response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResponseRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"
  /responses/{id}:
    parameters:
      - $ref: "#/components/parameters/ResponseId"
    get:
      operationId: getResponse
      tags: [responses]
      summary: Load a response to resume
      responses:
        "200":
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateResponse
      tags: [responses]
      summary: Autosave draft answers or add optional contact details to a completed response
      description: Completed responses accept contact-only updates. Their survey answers, completion time, and duration cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResponseRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Survey answers cannot be edited after completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /responses/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/ResponseId"
    post:
      operationId: completeResponse
      tags: [responses]
      summary: Submit survey answers before the optional contact section
      description: Idempotent. Repeated requests return the completed response without changing its answers, duration, or completion time. Use a contact-only PATCH to add optional contact details afterward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteResponseRequest"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/session:
    post:
      operationId: verifyAdminKey
      tags: [admin]
      summary: Verify the admin access key
      security:
        - AdminKey: []
      responses:
        "200":
          description: Key accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Headline statistics, demographics breakdowns and drop-off
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/PathFilter"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/responses:
    get:
      operationId: listAdminResponses
      tags: [admin]
      summary: Paginated list of responses with filters
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/PathFilter"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, complete]
        - name: sector
          in: query
          schema:
            type: string
        - name: nationality
          in: query
          schema:
            type: string
        - name: hasContact
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Response list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseList"
  /admin/skills-gap:
    get:
      operationId: getSkillsGap
      tags: [admin]
      summary: Importance vs performance per skill, B2B and B2C side by side
      security:
        - AdminKey: []
      responses:
        "200":
          description: Skills gap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsGapReport"
  /admin/course-demand:
    get:
      operationId: getCourseDemand
      tags: [admin]
      summary: Need index and book-now share per course
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/PathFilter"
      responses:
        "200":
          description: Course demand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDemandReport"
  /admin/training-pathways:
    get:
      operationId: getTrainingPathways
      tags: [admin]
      summary: Six training domains with their leading workshops and interested respondents' delivery preferences
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/PathFilter"
      responses:
        "200":
          description: Path-filtered training pathway board, including empty domains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingPathwaysReport"
        "400":
          description: Invalid path filter
        "401":
          description: Admin access required
  /admin/course-insight:
    get:
      operationId: getCourseInsight
      tags: [admin]
      summary: Selected workshop demand, domain position and interested respondents' programme preferences
      security:
        - AdminKey: []
      parameters:
        - name: courseId
          in: query
          required: true
          schema:
            type: string
            pattern: "^C[1-9][0-9]*$"
            maxLength: 16
        - $ref: "#/components/parameters/PathFilter"
      responses:
        "200":
          description: Read-only insight report for any survey workshop, including unobserved and zero-interest workshops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseInsightReport"
        "400":
          description: Invalid course identifier or path filter
        "401":
          description: Admin access required
        "404":
          description: Unknown survey workshop
  /admin/track-ranks:
    get:
      operationId: getTrackRanks
      tags: [admin]
      summary: Future-track ranking results
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/PathFilter"
      responses:
        "200":
          description: Track ranks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackRankReport"
  /admin/preferences:
    get:
      operationId: getPreferences
      tags: [admin]
      summary: Option counts for every single/multi choice question
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/PathFilter"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceReport"
  /admin/segments:
    get:
      operationId: getSegmentReport
      tags: [admin]
      summary: Key indicators recomputed inside each respondent segment (path, stakeholder group, sector, org size, nationality, gender, age, job level, education)
      security:
        - AdminKey: []
      responses:
        "200":
          description: Segment report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentReport"
  /admin/matching:
    get:
      operationId: getMatchingResults
      tags: [admin]
      summary: Catalogue workshops ranked by field need x desk evidence
      security:
        - AdminKey: []
      parameters:
        - name: needWeight
          in: query
          description: Field-need weight in percent (default 40); other weights scale proportionally
          schema:
            type: integer
            default: 40
      responses:
        "200":
          description: Matching results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingReport"
  /admin/catalogue:
    get:
      operationId: listCatalogue
      tags: [admin]
      summary: Catalogue workshops seeded from the desk study
      security:
        - AdminKey: []
      responses:
        "200":
          description: Workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogueWorkshop"
  /admin/export.csv:
    get:
      operationId: exportResponsesCsv
      tags: [admin]
      summary: Download all responses as CSV
      security:
        - AdminKey: []
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
components:
  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
  parameters:
    ResponseId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PathFilter:
      name: path
      in: query
      schema:
        $ref: "#/components/schemas/SurveyPath"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SurveyPath:
      type: string
      enum: [B2B, B2C]
    ResponseStatus:
      type: string
      enum: [draft, complete]
    Answers:
      type: object
      description: Raw answers keyed by question id (Q1..Q26). Values are strings, string arrays, or objects for matrices.
      additionalProperties: true
    ContactInfo:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    SurveyResponse:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ResponseStatus"
        path:
          oneOf:
            - $ref: "#/components/schemas/SurveyPath"
            - type: "null"
        consent:
          type: boolean
        currentStep:
          type: integer
        answers:
          $ref: "#/components/schemas/Answers"
        contact:
          oneOf:
            - $ref: "#/components/schemas/ContactInfo"
            - type: "null"
        sourceTag:
          type: string
          nullable: true
        device:
          type: string
          nullable: true
        durationSec:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, status, path, consent, currentStep, answers, contact, createdAt, updatedAt]
    CreateResponseRequest:
      type: object
      properties:
        sourceTag:
          type: string
        device:
          type: string
    UpdateResponseRequest:
      type: object
      properties:
        consent:
          type: boolean
        path:
          $ref: "#/components/schemas/SurveyPath"
        currentStep:
          type: integer
        answers:
          $ref: "#/components/schemas/Answers"
        contact:
          $ref: "#/components/schemas/ContactInfo"
    CompleteResponseRequest:
      type: object
      properties:
        path:
          $ref: "#/components/schemas/SurveyPath"
        answers:
          $ref: "#/components/schemas/Answers"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        durationSec:
          type: integer
      required: [path, answers]
    AdminSession:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    CountItem:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
        pct:
          type: number
      required: [key, label, count, pct]
    DailyCount:
      type: object
      properties:
        date:
          type: string
        started:
          type: integer
        completed:
          type: integer
      required: [date, started, completed]
    SectionDropOff:
      type: object
      properties:
        step:
          type: integer
        label:
          type: string
        reached:
          type: integer
        stuck:
          type: integer
      required: [step, label, reached, stuck]
    AdminSummary:
      type: object
      properties:
        total:
          type: integer
        completed:
          type: integer
        drafts:
          type: integer
        completionRate:
          type: number
        b2b:
          type: integer
        b2c:
          type: integer
        avgDurationSec:
          type: number
        medianDurationSec:
          type: number
        bookNowRespondents:
          type: integer
        contactsCaptured:
          type: integer
        hotLeads:
          type: integer
          description: Completed responses that both chose "book now" for a course and left contact details
        byDay:
          type: array
          items:
            $ref: "#/components/schemas/DailyCount"
        byNationality:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        byGender:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        byAge:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        byEducation:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        bySector:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        byJobLevel:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        byOrgSize:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        bySubSector:
          type: array
          description: Keys are "<sector>:<sub>" (e.g. private:finance_banking); labels resolved client-side
          items:
            $ref: "#/components/schemas/CountItem"
        byStakeholder:
          type: array
          description: Desk-study stakeholder groups G/P/S/I derived from path, sector and organisation size
          items:
            $ref: "#/components/schemas/CountItem"
        byDevice:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        durationBuckets:
          type: array
          description: Completion-time histogram in fixed order (under 3, 3-5, 5-7, 7-10, over 10 minutes)
          items:
            $ref: "#/components/schemas/CountItem"
        dropOff:
          type: array
          items:
            $ref: "#/components/schemas/SectionDropOff"
      required: [total, completed, drafts, completionRate, b2b, b2c, avgDurationSec, medianDurationSec, bookNowRespondents, contactsCaptured, hotLeads, byDay, byNationality, byGender, byAge, byEducation, bySector, bySubSector, byJobLevel, byOrgSize, byStakeholder, byDevice, durationBuckets, dropOff]
    ResponseList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SurveyResponse"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [items, total, page, pageSize]
    SkillStats:
      type: object
      properties:
        n:
          type: integer
        meanImportance:
          type: number
        meanPerformance:
          type: number
        meanGap:
          type: number
        weightedGap:
          type: number
        highGapShare:
          type: number
          description: Share (0-100) of raters whose importance exceeds performance by 2 or more points
      required: [n, meanImportance, meanPerformance, meanGap, weightedGap, highGapShare]
    SkillGapItem:
      type: object
      properties:
        skillId:
          type: string
        label:
          type: string
        all:
          $ref: "#/components/schemas/SkillStats"
        b2b:
          $ref: "#/components/schemas/SkillStats"
        b2c:
          $ref: "#/components/schemas/SkillStats"
      required: [skillId, label, all, b2b, b2c]
    SkillsGapReport:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkillGapItem"
      required: [items]
    CourseDemandItem:
      type: object
      properties:
        courseId:
          type: string
        label:
          type: string
        groupId:
          type: string
        groupLabel:
          type: string
        shown:
          type: integer
        notInterested:
          type: integer
        future:
          type: integer
        bookNow:
          type: integer
        needIndex:
          type: number
          description: 0-100 (mean of 0/1/2 codes / 2 x 100)
        bookNowShare:
          type: number
      required: [courseId, label, groupId, groupLabel, shown, notInterested, future, bookNow, needIndex, bookNowShare]
    CourseDemandGroup:
      type: object
      description: How often each course group was chosen in the Q25G gate question.
      properties:
        groupId:
          type: string
        label:
          type: string
        respondents:
          type: integer
          description: Respondents who answered the gate question
        selected:
          type: integer
        selectedShare:
          type: number
          description: selected / respondents x 100
      required: [groupId, label, respondents, selected, selectedShare]
    CourseDemandReport:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/CourseDemandGroup"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseDemandItem"
      required: [groups, items]
    PathwayWorkshop:
      type: object
      properties:
        demand:
          $ref: "#/components/schemas/CourseDemandItem"
        interestedRespondents:
          type: integer
          description: Completed respondents rating this course 1 or 2. Preferences below use only this cohort.
        preferences:
          type: array
          description: Q19-Q23 and Q26 within the interested cohort. Each question has its own answered denominator; all ties are retained. These are respondents' general preferences, not causal explanations of course demand.
          items:
            $ref: "#/components/schemas/QuestionBreakdown"
        catalogue:
          $ref: "#/components/schemas/CatalogueWorkshop"
      required: [demand, interestedRespondents, preferences]
    TrainingPathwayDomain:
      type: object
      properties:
        groupId:
          type: string
        label:
          type: string
        gate:
          $ref: "#/components/schemas/CourseDemandGroup"
        evaluatedCourses:
          type: integer
        interestedCourses:
          type: integer
          description: Courses with at least one valid rating of 1 or 2
        evaluatedRespondents:
          type: integer
          description: Distinct completed respondents with at least one valid course rating in this domain
        topCourses:
          type: array
          description: Up to three interested courses ordered by need index, book-now share, shown count, then stable numeric course id. Unshown or entirely uninterested courses never fill empty places.
          items:
            $ref: "#/components/schemas/PathwayWorkshop"
      required: [groupId, label, gate, evaluatedCourses, interestedCourses, evaluatedRespondents, topCourses]
    TrainingPathwaysReport:
      type: object
      properties:
        respondents:
          type: integer
        courseCount:
          type: integer
        evaluatedCourses:
          type: integer
        domains:
          type: array
          description: All six current survey domains G1-G6, even with no responses
          items:
            $ref: "#/components/schemas/TrainingPathwayDomain"
      required: [respondents, courseCount, evaluatedCourses, domains]
    CourseInsightSlice:
      type: object
      description: Course ratings within one respondent path and the selected report scope; never includes identities.
      properties:
        path:
          $ref: "#/components/schemas/SurveyPath"
        shown:
          type: integer
        interested:
          type: integer
        bookNow:
          type: integer
        needIndex:
          type: [number, "null"]
          description: Null when nobody in this path rated the selected course.
      required: [path, shown, interested, bookNow, needIndex]
    CourseInsightReport:
      type: object
      properties:
        respondents:
          type: integer
          description: Complete responses in the selected path, not the denominator for course demand.
        state:
          type: string
          enum: [not_evaluated, no_interest, interested]
        workshop:
          $ref: "#/components/schemas/PathwayWorkshop"
        domain:
          $ref: "#/components/schemas/CourseDemandGroup"
        domainCourseCount:
          type: integer
        domainEvaluatedCourses:
          type: integer
        domainRank:
          type: [integer, "null"]
          description: Competition rank among evaluated courses in this domain by need index, book-now share, then shown count. Equal metrics share rank. Null for unobserved courses.
        rankTied:
          type: boolean
        byPath:
          type: array
          description: B2B and B2C course metrics within the report scope; an excluded path has no data, not evidence of no demand.
          items:
            $ref: "#/components/schemas/CourseInsightSlice"
      required: [respondents, state, workshop, domain, domainCourseCount, domainEvaluatedCourses, domainRank, rankTied, byPath]
    TrackRankItem:
      type: object
      properties:
        trackId:
          type: string
        label:
          type: string
        n:
          type: integer
        meanRank:
          type: number
        firstPlaceShare:
          type: number
        score:
          type: number
          description: 0-100 priority score (Borda normalised)
        rankDistribution:
          type: array
          description: Respondents who placed the track at position 1, 2, ... (index 0 = first place)
          items:
            type: integer
      required: [trackId, label, n, meanRank, firstPlaceShare, score, rankDistribution]
    TrackRankReport:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrackRankItem"
      required: [items]
    QuestionBreakdown:
      type: object
      properties:
        questionId:
          type: string
        label:
          type: string
        respondents:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
      required: [questionId, label, respondents, options]
    PreferenceReport:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBreakdown"
      required: [questions]
    NumberMap:
      type: object
      additionalProperties:
        type: number
    StringMap:
      type: object
      additionalProperties:
        type: string
    SegmentTopCourse:
      type: object
      properties:
        courseId:
          type: string
        label:
          type: string
        needIndex:
          type: number
        bookNowShare:
          type: number
        shown:
          type: integer
      required: [courseId, label, needIndex, bookNowShare, shown]
    SegmentSlice:
      type: object
      description: Indicators recomputed on the completed responses inside one segment
      properties:
        key:
          type: string
        label:
          type: string
        n:
          type: integer
          description: Completed responses in the segment
        skillRaters:
          type: integer
        skillGaps:
          description: Importance-weighted gap per skill id
          $ref: "#/components/schemas/NumberMap"
        skillHighGap:
          description: Share of raters with a gap of 2+ per skill id
          $ref: "#/components/schemas/NumberMap"
        groupNeed:
          description: Pooled need index (0-100) per course group among courses shown
          $ref: "#/components/schemas/NumberMap"
        groupSelect:
          description: Share of gate respondents who selected each course group
          $ref: "#/components/schemas/NumberMap"
        trackScores:
          description: Borda priority score per current track id
          $ref: "#/components/schemas/NumberMap"
        topCourses:
          type: array
          items:
            $ref: "#/components/schemas/SegmentTopCourse"
        prefs:
          description: Most chosen option key per preference question (Q19-Q23, Q26)
          $ref: "#/components/schemas/StringMap"
        prefShares:
          description: Share (0-100) of the most chosen option per preference question
          $ref: "#/components/schemas/NumberMap"
        bookNowShare:
          type: number
      required: [key, label, n, skillRaters, skillGaps, skillHighGap, groupNeed, groupSelect, trackScores, topCourses, prefs, prefShares, bookNowShare]
    SegmentDimension:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        questionId:
          type: string
          nullable: true
          description: Source question when slices map 1:1 to its options (labels can be resolved client-side)
        slices:
          type: array
          items:
            $ref: "#/components/schemas/SegmentSlice"
      required: [id, label, questionId, slices]
    SegmentReport:
      type: object
      properties:
        respondents:
          type: integer
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/SegmentDimension"
      required: [respondents, dimensions]
    CatalogueWorkshop:
      type: object
      properties:
        id:
          type: string
        titleEn:
          type: string
        titleAr:
          type: string
        categoryId:
          type: integer
        categoryLabel:
          type: string
        tier:
          type: string
        days:
          type: integer
        top50Rank:
          type: integer
          nullable: true
        evidenceScore:
          type: number
        marketDemandPct:
          type: number
        kuwaitPlansCount:
          type: integer
        localSupply:
          type: string
          enum: [None, Emerging, Established]
        audience:
          type: array
          items:
            type: string
        shortlisted:
          type: boolean
      required: [id, titleEn, titleAr, categoryId, categoryLabel, tier, days, top50Rank, evidenceScore, marketDemandPct, kuwaitPlansCount, localSupply, audience, shortlisted]
    MatchingItem:
      type: object
      properties:
        workshop:
          $ref: "#/components/schemas/CatalogueWorkshop"
        fieldNeed:
          type: number
          description: 0-100 confirmed field need from linked survey items
        fieldN:
          type: integer
        linkedItems:
          type: array
          items:
            type: string
        primaryItems:
          type: array
          description: Survey items whose primary catalogue link is this workshop (the items used for field-need scoring)
          items:
            type: string
        gridCell:
          type: string
          enum: [confirmed_priority, new_demand, evidence_led, defer]
        compositeScore:
          type: number
        rank:
          type: integer
        rankShift:
          type: integer
          description: Rank change under +/-10 need-weight sensitivity test
        supplyAction:
          type: string
          enum: [Build, Expand, Select]
      required: [workshop, fieldNeed, fieldN, linkedItems, primaryItems, gridCell, compositeScore, rank, rankShift, supplyAction]
    MatchingReport:
      type: object
      properties:
        needWeight:
          type: integer
        respondents:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/MatchingItem"
      required: [needWeight, respondents, items]
